[project]
name = "wind-forecast-monitor"
version = "0.1.0"
description = "Day-ahead wind forecast monitoring and accuracy analytics for the GB market"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD"]
ignore = ["PD901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
